[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "movie-trend-bot"
version = "0.1.0"
description = "Resource-bounded public TikTok trend monitor and Telegram bot"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<0.29", "python-dotenv>=1.1,<2", "playwright>=1.55,<2", "tzdata>=2025.2"]

[project.optional-dependencies]
dev = ["pytest>=8.4,<10", "pytest-asyncio>=1.2,<2", "ruff>=0.13,<1"]

[project.scripts]
movie-trend-bot = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
